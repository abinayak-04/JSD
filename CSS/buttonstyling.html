<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button{
            font-size:30px;
            margin-right: 60px;
            margin-top: 20px;
             padding: 15px;
            font-family: sans-serif;
            border-radius: 20px;
            background-color: chocolate;
            border: none;
            outline: none;
            color: white;

        }
        button:hover{
            cursor: pointer;
            background-color: cyan;
            color: black;
        }
        #b1:hover{
            outline: 3px solid darkgreen;
            border-radius: 0 25px 0 25px;
        }
        #b2:hover{
            outline: 3px solid darkgreen;
            border-radius: 25px 0 25px 0;
        }
    </style>
</head>
<body>
    <button id="b1">Home</button>
    <button id="b2">About US</button>
    <button id="b3">Explore</button>
    <button id="b4">Login</button>
</body>
</html>
