<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        var i=0;
        function slideimg(){
            if(i==1)
            document.getElementById("img").src="/CSS/Images/lion.jpg";
            if(i==2)
            document.getElementById("img").src="/CSS/Images/tiger.jpg";  
            if(i==3)
            document.getElementById("img").src="/CSS/Images/elephant.jpg";
            if(i==4)
            document.getElementById("img").src="/CSS/Images/zebra.jpg";
        i++;
        if(i>=5)
        i=1;
    setTimeout(slideimg,500)
        }
    </script>
</head>
<body onload="slideimg()">
    <h1><center>Image Sliding</center></h1>
    <center>
        <img id="img"style="border: 8px ridge gold;" src="/CSS/Images/lion.jpg" width="50%">
    </center>
</body>
</html>
