<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        function Result(){
        var m1=parseInt(document.getElementById("t1").value);
        var m2=parseInt(document.getElementById("t2").value);
        var m3=parseInt(document.getElementById("t3").value);
        var m4=parseInt(document.getElementById("t4").value);
        var m5=parseInt(document.getElementById("t5").value);
        var tot=m1+m2+m3+m4+m5;
        var per=tot/5.0;
        var res="";
        if(m1>34 && m2>34 && m3>34 && m4>34 && m5>34)
        res="PASS";
        else
        res="FAIL";
        if(res=="PASS"){
            document.getElementById("r1").innerHTML="<font color='green'>Total Marks:"+tot;
            document.getElementById("r2").innerHTML="<font color='green'>Percentage :"+per;
            document.getElementById("r3").innerHTML="<font color='green'>Result:"+res;
        }
        else{
            document.getElementById("r1").innerHTML="<font color='red'>Total Marks:"+tot;
            document.getElementById("r2").innerHTML="<font color='red'>Percentage :"+per;
            document.getElementById("r3").innerHTML="<font color='red'>Result:"+res;
        }
        }
    </script>
</head>
<body>
    <label >Mark 1:</label><input type="text" id="t1" placeholder="Enter mark 1"><br>
    <label >Mark 2:</label><input type="text" id="t2" placeholder="Enter mark 2"><br>
    <label >Mark 3:</label><input type="text" id="t3" placeholder="Enter mark 3"><br>
    <label >Mark 4:</label><input type="text" id="t4" placeholder="Enter mark 4"><br>
    <label >Mark 5:</label><input type="text" id="t5" placeholder="Enter mark 5"><br>
    <input type="button" value="Result" onclick="Result()">
    <div id="r1"></div>
    <div id="r2"></div>
    <div id="r3"></div>
</body>
</html>
