<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        function sumofseries(){
            var sno=parseInt(document.getElementById("t1").value);
            var eno=parseInt(document.getElementById("t2").value);
            var res="",sum=0;
            for(var i=sno; i<=eno; i++){
                sum=sum+i;
                if(i==eno)
                    res=res+i+"";
                else
                    res=res+i+"+";
            }
            document.getElementById("ans").innerHTML=res+"="+sum;
        }
    </script>
</head>
<body>
    <h1><center>Sum of series</center></h1>
    <input type="text" id="t1" placeholder="Enter start number"> <br>
    <input type="text" id="t2" placeholder="Enter end number"><br>
    <input type="button" value="Show answer" onclick="sumofseries()">
    <div id="ans"></div>
</body>
</html>
