<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Break</title>
    <script type="text/javascript">
        function brk(){
            var n1=parseInt(document.getElementById("t1").value);
            var n2=parseInt(document.getElementById("t2").value);
            var ans="";
            for(var i=n1; i<=n2; i++){
                if(i>=5)
                    break;

            ans=ans+i+" ";
            }
            document.getElementById("res").innerHTML=ans;
        }
         function brk1(){
            var n1=parseInt(document.getElementById("t1").value);
            var n2=parseInt(document.getElementById("t2").value);
            var ans="";
            for(var i=n1; i<=n2; i++){
                 ans=ans+i+" ";
                if(i<=5)
                    break;
            }
            document.getElementById("res").innerHTML=ans;
        }
    </script>
</head>
<body>
    <h1><center>Jumping statements Break</center></h1>
    <h3>condition is if(i>=5)---->break</h3>
    <input type="text" id="t1" placeholder="Enter 1st no."><br>
    <input type="text" id="t2" placeholder="Enter 2nd no."><br>
    <input type="button" value="Break test" onclick="brk()"><br>
    <h3>condition is if(i<=5)---->break</h3>
    <input type="button" value="Break test" onclick="brk1()">
    <div id="res"></div>
</body>
</html>
