<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        function primeornot(){
            var n=parseInt(document.getElementById("t1").value);
            var cnt=0;
            for(var i=1;i<=n;i++){
                if(n%i==0)
                cnt++;
            }
            if(cnt>2)
                document.write(n+" is not a prime number");
            else
                document.write(n+" is a prime number");
        }
    </script>
</head>
<body>
    <h1><center>Whether a number is prime or not</center></h1>
    <input type="text" id="t1" placeholder="Enter a number">
    <button onclick="primeornot()">Check</button>
</body>
</html>
