<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        function posorneg(){
            var n=parseInt(document.getElementById("t1").value);
            if(n>0)
            document.getElementById("r1").innerHTML="The number "+n+" is Positive";
            else if(n<0)
            document.getElementById("r1").innerHTML="The number "+n+" is Negative";
            else
            document.getElementById("r1").innerHTML="The number is Zero";
        }
    </script>
</head>
<body>
    <h2><center>Find the number is positive ,negative or zero</center></h2>
    <label>Enter a number:</label>
    <input type="text" id="t1" placeholder="Enter a number"><br>
    <input type="button" value="Result" onclick="posorneg()">
    <div id="r1"></div>
</body>
</html>
