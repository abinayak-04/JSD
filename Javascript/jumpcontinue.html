<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        function con(){
            var n1=parseInt(document.getElementById("t1").value);
            var n2=parseInt(document.getElementById("t2").value);
            var ans="";
            for(var i=n1; i<=n2; i++){
                if(i<=20)
                    continue;

            ans=ans+i+" ";
            }
            document.getElementById("res").innerHTML=ans;
        }
    </script>
</head>
<body>
    <h1><center>Jumping statements Continue</center></h1>
    <h3>condition is if(i<=20)---->continue</h3>
    <input type="text" id="t1" placeholder="Enter 1st no."><br>
    <input type="text" id="t2" placeholder="Enter 2nd no."><br>
    <input type="button" value="Continue test" onclick="con()">
    <div id="res"></div>
</body>
</html>
