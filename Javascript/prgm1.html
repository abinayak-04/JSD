<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        var a=10;
        var b=20;
        var c=a+b;
        document.write("<h1>Welcome to javascript</h1>");
        document.write("<br><h2>Total:"+c);
            console.log("Result:"+c);
            document.write("<br><marquee><h1>Total:"+c+"</h1></marquee>");
            // var ----> global + assign
            if(true){
                var v=10;
                v++;
            }
            v++;
            document.write("<br>value Of var v:"+v);
            console.log("value of var v:"+v);

            //let ---->local + assign
            if(true)
            {
                let l=10;
                l++;
            }
            l++;
            document.write("<br>value Of let l:"+l);// output will not display it shows error(l is not defined)
            console.log("value of let l:"+l);// output will not display it shows error(l is not defined)
           
             
    </script>
</head>

</body>
</html>
