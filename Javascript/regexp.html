<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        function checkvalid(){
            var data=document.getElementById("t1").value;
            var re=/^[0-9]{10}$/;
            if(data.match(re))
                alert("Valid mobile number!");
            else
                alert("Invalid mobile number!");
        }
    </script>
</head>
<body>
    <h2><center>Regular Expression mobile no. validation</center></h2>
    <input type="text" id="t1" placeholder="Enter Mobile no"><br>
    <input type="button" value="check valid or not" onclick="checkvalid()">
</body>
</html>
