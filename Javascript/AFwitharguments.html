<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        var add=(a,b,c)=>{
            var tot=a+b+c;
            alert(tot);
        }
    </script>
</head>
<body>
    <h2><center>Arrow function with arguments/parameters</center></h2>
    <input type="button" value="Arrow function with arguments" onclick="add(11,4,5)">
</body>
</html>
