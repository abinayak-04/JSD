<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Document</title>
</head>
<body>
  
    <button class="btn btn-outline-success btn-sm">clickme</button>
    <button class="btn btn-outline-danger btn-lg" >clickme</button>
    <button class="btn btn-outline-info" disabled>clickme</button>
    <button class="btn btn-outline-primary">clickme</button>
    <button class="btn btn-outline-warning">clickme</button>
    <button class="btn btn-outline-secondary">clickme</button>
    <button class="btn btn-outline-light">clickme</button>
    <button class="btn btn-outline-dark">clickme</button>
    <button class="btn btn-outline-link">clickme</button>
    <hr>
    <h2>Block buttons</h2>
    <div class="d-grid gap-4 col-6 mx-auto" > <!--col is size,mx-auto is to make it in center-->
        <button class="btn btn-success">clickme</button>
        <button class="btn btn-danger">clickme</button>
        <button class="btn btn-info">clickme</button>
        <button class="btn btn-primary">clickme</button>
        <button class="btn btn-warning">clickme</button>
        <button class="btn btn-secondary">clickme</button>
        <button class="btn btn-light">clickme</button>
        <button class="btn btn-dark">clickme</button>
        <button class="btn btn-link">clickme</button>

    </div>
    <hr>
    <h2>Group buttons</h2>
    <div class="btn-group" >
        <button class="btn btn-success">clickme</button>
        <button class="btn btn-danger">clickme</button>
        <button class="btn btn-info">clickme</button>
    </div>
    <hr>
    <h2>Active buttons</h2>
    <div class="btn-group" >
        <button class="btn btn-success ">clickme</button>
        <button class="btn btn-success active">clickme</button>
        <button class="btn btn-success">clickme</button>
    </div>
</body>
</html>
